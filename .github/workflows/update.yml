name: update-site
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build news
        run: python build.py

      - name: Restore index.html from base64
        run: |
          if [ -f data/index_b64.txt ]; then
            base64 -d data/index_b64.txt > index.html
            rm data/index_b64.txt
          fi

      - name: Commit update
        run: |
          git config user.name "site-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "auto: update news"
          git push
