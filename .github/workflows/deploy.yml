name: deploy-site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decode batch files
        run: |
          while IFS= read -r line; do
            name="${line%%|*}"
            b64="${line#*|}"
            printf '%s' "$b64" | base64 -d > "$name"
            echo "decoded: $name"
          done < <(cat data/batch_*.txt data/ch2_*.txt data/ch3_*.txt data/ch4_*.txt)
      - name: Build fresh content
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
